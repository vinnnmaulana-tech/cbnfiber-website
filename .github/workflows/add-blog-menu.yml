name: Add Blog Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-blog-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Blog / Artikel menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="/blog/">Blog / Artikel</a>' not in s:
              marker = '<a href="#faq">FAQ</a>'
              if marker not in s:
                  raise SystemExit('FAQ menu marker not found')
              s = s.replace(marker, marker + '\n<a href="/blog/">Blog / Artikel</a>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit menu change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Blog / Artikel menu'
          git push
